<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>사내망 보안 분석 중</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .spinner {
            margin: 0 auto 30px auto;
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #0056b3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 15px 0;
            color: #1a1a1a;
            font-size: 22px;
        }
        p.main-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            margin: 0 0 20px 0;
            word-break: keep-all;
        }
        p.sub-desc {
            font-size: 14px;
            color: #888;
            margin: 0;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
        }
        .target-url {
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            color: #0056b3;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
    <script>
        // 화면이 로드되면 2초(2000ms) 후에 AI 판별이 끝났다고 가정하고 원래 URL로 이동합니다.
        window.onload = function() {
            setTimeout(function() {
                // Flask에서 넘겨준 변수가 이 자리에 자동으로 들어갑니다.
                var targetUrl = "{{ return_url }}";
                
                // 만약 http:// 나 https:// 가 없다면 붙여서 이동시킵니다.
                if (!targetUrl.match(/^[a-zA-Z]+:\/\//)) {
                    targetUrl = 'http://' + targetUrl;
                }
                
                window.location.replace(targetUrl);
            }, 2000);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>실시간 보안 분석 중입니다</h2>
        <p class="main-desc">
            접속하신 주소는 사내망에 등록되지 않은 미분류 도메인입니다.<br>
            현재 AI 보안 엔진이 해당 웹사이트의 안전성을 실시간으로 분석하고 있으니 잠시만 기다려 주십시오.
        </p>
        <p class="sub-desc">
            판별이 완료되면 요청하신 웹사이트로 자동 연결됩니다.
        </p>
        <!-- 사용자에게 돌아갈 원래 주소를 살짝 보여주어 안심시킵니다 -->
        <div class="target-url">Target: {{ return_url }}</div>
    </div>
</body>
</html>
