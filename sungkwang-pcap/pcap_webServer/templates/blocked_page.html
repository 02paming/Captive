<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 제한 알림</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #d9534f;
        }

        .icon {
            font-size: 60px;
            color: #d9534f;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .info-box {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-box p {
            margin: 5px 0;
            font-size: 14px;
        }

        .footer {
            font-size: 12px;
            color: #999;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>접근이 제한된 사이트입니다.</h1>
        <p>사내 보안 규정에 따라 요청하신 웹사이트로의 접근이 차단되었습니다. 업무와 무관하거나 보안 위협이 있는 사이트는 접속할 수 없습니다.</p>

        <div class="info-box">
            <p><strong>접속 시도 IP:</strong> <span id="client-ip">확인 중...</span></p>
            <p><strong>접속 시도 URL:</strong> <span id="attempted-url">확인 중...</span></p>
            <p><strong>기록 알림:</strong> 현재 접속 시도 내역은 사내 보안 시스템에 기록됩니다.</p>
        </div>

        <p>업무상 반드시 접속이 필요한 경우, 사내 보안 담당자 또는 IT 부서에 문의해 주시기 바랍니다.</p>

        <div class="footer">
            &copy; 2026 SecureTech IT Security Team
        </div>
    </div>

    <script>
        // URL 파라미터에서 정보 추출 (PCAP 리다이렉트 시 파라미터로 넘겨줄 경우를 대비)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url') || '알 수 없음';
        const clientIp = urlParams.get('ip') || '알 수 없음';

        // 단순 클라이언트 IP 확인용 (실제 환경에서는 서버에서 렌더링 시 주입하거나, PCAP에서 파라미터로 넘기는 방식 추천)
        document.getElementById('attempted-url').innerText = targetUrl;

        // IP는 예시로 표시
        document.getElementById('client-ip').innerText = clientIp; 
    </script>

</body>

</html>
