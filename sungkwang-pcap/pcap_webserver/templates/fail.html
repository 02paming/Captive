<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사내망 인증 실패</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }
        h2 {
            color: #e74c3c; /* 경고의 빨간색 */
            margin-top: 0;
            margin-bottom: 15px;
        }
        p {
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        /* 실패 테마에 맞춘 붉은색 버튼 */
        .btn-fail {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-fail:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>사원 정보가 없습니다!</h2>
        
        <p>입력하신 이름과 사번이 일치하지 않거나<br>
        시스템에 등록되지 않은 정보입니다.<br>
        <span style="color: #7f8c8d; font-size: 13px; display: block; margin-top: 10px;">
            정확한 정보를 다시 한 번 확인해 주세요.
        </span></p>
        
        <!-- 다시 index.html (루트)로 돌아가는 버튼 -->
        <button class="btn-fail" onclick="location.href='/'">다시 인증하기</button>
    </div>
</body>
</html>
