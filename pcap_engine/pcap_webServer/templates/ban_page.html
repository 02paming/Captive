<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접속 차단 안내</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2c2c2c;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #ff4c4c;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4c4c;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #3a3a3a;
            border: 1px solid #555;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            margin-bottom: 20px;
        }
        .info-box p {
            margin: 8px 0;
            font-size: 14px;
            color: #eee;
        }
        .highlight {
            color: #ff4c4c;
            font-weight: bold;
        }
        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚫</div>
        <h1>접속이 차단되었습니다.</h1>
        <!-- MAC 밴 뿐만 아니라 계정 정지 상황에도 어울리도록 안내 문구를 포괄적으로 수정 -->
        <p>보안 정책 위반 또는 계정 상태 제한으로 인해 접근이 차단되었습니다.</p>

        <div class="info-box">
            <!-- js 대신 Flask 템플릿 변수를 사용하여 차단 사유 출력 -->
            <p><strong>차단 사유:</strong> <span id="block-reason" class="highlight">{{ error_msg | default('보안 정책 위반 (사유 미지정)') }}</span></p>
        </div>

        <p>본 차단 조치에 대한 문의 사항은 네트워크 보안 관리자에게 연락하시기 바랍니다.</p>

        <div class="footer">
            &copy; 2026 Network Security Control
        </div>
    </div>

    <!-- 기존 URL 파라미터를 파싱하던 <script> 블록은 완전히 삭제되었습니다. -->

</body>
</html>
